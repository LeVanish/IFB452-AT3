<!DOCTYPE html>
<html>

<head>
    <title>Order Details</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
</head>

<body>

    <h1>Order Details</h1>

    <div id="orderInfo"></div>

    <hr>

    <button id="depositButton">
        Deposit Payment
    </button>

    <button id="confirmButton">
        Confirm Delivery
    </button>

    <button id="releaseButton">
        Release Funds
    </button>

    <button id="refundButton">
        Refund
    </button>

    <hr>

    <button id="shippedButton">
        Mark Shipped
    </button>

    <button id="transitButton">
        Mark In Transit
    </button>

    <button id="deliveredButton">
        Mark Delivered
    </button>

    <script type="module" src="js/order.js"></script>

</body>

</html>
