<!DOCTYPE html>
<html>

  <head>
    <title>Escrow Dropshipping dApp</title>
    <script type="module" src="./js/app.js" defer></script>
  </head>

  <body>

    <h1>Escrow Dropshipping dApp</h1>

    <div>
      Wallet:
      <span id="walletAddress">Not Connected</span>
    </div>
    <button id="connectBtn">Connect Wallet</button>

    <hr>

    <h2>Create Order</h2>

    <input id="customer" placeholder="Customer Address">
    <br><br>
    <input id="supplier" placeholder="Supplier Address">
    <br><br>
    <input id="productName" placeholder="Product Name">
    <br><br>
    <input id="quantity" type="number" placeholder="Quantity">
    <br><br>
    <input id="price" type="number" placeholder="Price in Wei">
    <br><br>

    <button id="createOrderBtn">Create Order</button>

    <hr>

    <h2>Assign Delivery Provider</h2>

    <input id="assignOrderId" placeholder="Order ID">
    <br><br>
    <input id="deliveryProvider" placeholder="Delivery Provider Address">
    <br><br>

    <button id="assignDeliveryBtn">Assign Delivery Provider</button>

    <hr>

    <h2>View Order</h2>

    <input id="viewOrderId" placeholder="Order ID">
    <br><br>

    <button id="viewOrderBtn">View Order</button>

    <div id="orderDetails"></div>

    <hr>

    <h2>Escrow</h2>

    <input id="depositOrderId" placeholder="Order ID">
    <br><br>

    <button id="depositBtn">Deposit Payment</button>
    <button id="confirmDeliveryBtn">Confirm Delivery</button>
    <button id="releaseFundsBtn">Release Funds</button>
    <button id="refundBtn">Refund</button>

    <hr>

    <h2>Delivery</h2>

    <input id="deliveryOrderId" placeholder="Order ID">
    <br><br>

    <button id="shippedBtn">Mark Shipped</button>
    <button id="transitBtn">Mark In Transit</button>
    <button id="deliveredBtn">Mark Delivered</button>

    <hr>

    <h2>Fail Order</h2>

    <input id="failOrderId" placeholder="Order ID">
    <br><br>

    <button id="failOrderBtn">Mark Failed</button>

  </body>

</html>
